<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>手势试炼 · Gesture Trials</title>
  <link rel="stylesheet" href="style.css" />

  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
</head>
<body>
  <div class="app">
    <header>
      <h1>手势试炼</h1>
      <p class="subtitle">五道关卡，用手势一路通关</p>
      <div class="level-track" id="levelTrack"></div>
    </header>

    <main class="game-board">
      <!-- 玩家 -->
      <section class="panel player-panel">
        <div class="panel-head">
          <h2>你的镜头</h2>
          <span class="hand-status" id="handStatus">等待举手</span>
        </div>
        <div class="video-wrap">
          <video id="video" autoplay playsinline muted></video>
          <canvas id="overlay"></canvas>
          <div class="video-hint" id="videoHint">请把手放进画面</div>
        </div>

        <div class="hold-track" id="holdTrack"><div class="hold-fill" id="holdFill"></div></div>
        <div class="hold-label" id="holdLabel">等待回合开始</div>

        <div class="gesture-badge" id="playerGesture">—</div>
        <div class="score" id="playerScore">0</div>
      </section>

      <!-- 中央 -->
      <section class="center-panel">
        <div class="level-name" id="levelName">手势试炼</div>
        <div class="level-goal" id="levelGoal">选择关卡开始</div>

        <div class="big-state" id="bigState">—</div>
        <div class="result" id="result"></div>
        <div class="seq-bar" id="seqBar"></div>

        <div class="center-actions">
          <button class="mini-btn" id="retryBtn">重来本关</button>
          <button class="mini-btn" id="menuBtn">选择关卡</button>
        </div>
      </section>

      <!-- 电脑 -->
      <section class="panel cpu-panel">
        <div class="panel-head">
          <h2>对手</h2>
          <span class="hand-status" id="cpuStatus">待命</span>
        </div>
        <div class="cpu-hand" id="cpuHand">❓</div>
        <div class="gesture-badge" id="cpuGesture">—</div>
        <div class="score" id="cpuScore">0</div>
      </section>
    </main>

    <footer>
      <p>✊ 握拳 = 石头　·　✋ 张开 = 布　·　✌ 食指中指 = 剪刀</p>
      <p class="dim">做出手势后保持约 1 秒即可锁定，进度条走满即出拳</p>
    </footer>
  </div>

  <!-- 弹窗 -->
  <div class="modal-mask" id="modalMask">
    <div class="modal" id="modal">
      <div class="modal-icon" id="modalIcon">🎮</div>
      <h3 id="modalTitle">标题</h3>
      <p id="modalDesc">描述</p>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <script src="audio.js"></script>
  <script src="levels.js"></script>
  <script src="gesture.js"></script>
  <script src="game.js"></script>
</body>
</html>
